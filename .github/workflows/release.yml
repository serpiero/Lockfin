name: Native packages
on:
  push:
    branches: [hardening]
    tags: ['v*']
    paths:
      - 'tools/**'
      - 'desktop.py'
      - 'flipper_sync.py'
      - 'requirements.lock'
      - 'login_manager.c'
      - 'application.fam'
      - 'assets/**'
      - 'third_party/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  faps:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python tools/build_faps.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-faps
          path: |
            dist/lockfin.fap
            dist/official/lockfin.fap
          if-no-files-found: error
  native:
    needs: faps
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder: windows
          - os: macos-latest
            builder: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      SIGNING_AVAILABLE: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firmware-faps
          path: dist
      - name: Install hash-pinned dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Confirm Inno Setup is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 is missing from this runner.' }
          "ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and smoke-test native artifact
        run: python tools/build_${{ matrix.builder }}.py
      - name: Certificate signing gate
        if: env.SIGNING_AVAILABLE == 'true'
        run: python -c "raise SystemExit('Configure certificate signing and notarization before enabling SIGNING_AVAILABLE')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lockfin-${{ matrix.builder }}-${{ github.sha }}
          path: |
            dist/pc/Lockfin-*.exe
            dist/pc/Lockfin-*.dmg
            dist/pc/*.runtime.txt
            dist/pc/SHA256SUMS
          if-no-files-found: error
