name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install hash-pinned dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Vault self-test
        run: python vault.py self-test
      - name: Compile tracked Python files
        run: git ls-files -z '*.py' | xargs -0 python -m compileall -q
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --retry 3 -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan complete Git history
        run: '"$RUNNER_TEMP/gitleaks" git . --redact=100 --no-banner'
